<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HorneLore Travel Documenter (standalone)</title>
  <link rel="stylesheet" href="css/travel-documenter.css" />
</head>
<body class="td-standalone">
  <!-- WO-TRAVEL-DOCUMENTER-NATIVE-PANEL-01: this page is now a THIN
       WRAPPER around the mountable module in js/travel-documenter.js.
       The real surface is the native operator "Travel Doc" tab inside
       hornelore1.0.html, which mounts the same module with the
       selected narrator's person_id (no copy/paste). This page stays
       as an API demo / fallback with its own connection inputs. -->
  <header class="td-shell-head">
    <div>
      <p class="td-kicker">HorneLore API Tool</p>
      <h1>Travel Documenter</h1>
      <p class="td-lede">Standalone wrapper for the operator trip-documentation panel. It does not touch Lori or the Life Map Travels shelf.</p>
    </div>
  </header>

  <div id="tdStandaloneHost"></div>

  <script src="js/travel-documenter.js"></script>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      window.lvTravelDocumenterMount(
        document.getElementById("tdStandaloneHost"),
        {
          standalone: true,
          apiBase: qs.get("api") || "http://localhost:8000",
          person_id: qs.get("person_id") || "",
        }
      );
    })();
  </script>
</body>
</html>
